services:
  - type: web
    name: tdm-cartevisite
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: tdm-db
          property: connectionString
      - key: PORT
        value: "10000"

databases:
  - name: tdm-db
    databaseName: tdm_cartevisite
    user: tdm_user
    plan: free
